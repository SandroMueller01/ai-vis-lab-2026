name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.1"  # keep in sync with requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-vis-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm ai-vis-lab:ci python -c "import tirex2, torch; print('imports ok')"
          # Every CLI script must at least start (catches missing deps and syntax errors).
          docker run --rm ai-vis-lab:ci sh -c 'for f in $(find . -path "./data" -prune -o -name "build_*.py" -print); do echo "$f --help"; python "$f" --help > /dev/null || exit 1; done'
