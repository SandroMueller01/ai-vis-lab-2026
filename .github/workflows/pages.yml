name: Pages

# Publishes the Phase I dashboard (phase1-model-behavior/pair-1/dashboard/site) on GitHub Pages.
# One-time setup in the repository: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "phase1-model-behavior/pair-1/dashboard/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: phase1-model-behavior/pair-1/dashboard/site
      - id: deployment
        uses: actions/deploy-pages@v4
